<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body { width: 1400px; height: 560px; }
  .stage { display: flex; align-items: center; padding: 0 88px; }

  .copy { flex: 1; }
  .brand { margin-bottom: 34px; }
  .h1 { font-size: 76px; margin-bottom: 20px; }
  .sub { font-size: 31px; max-width: 660px; }
  .pills { display: flex; gap: 12px; margin-top: 32px; }

  /* Kol sağdan bütün halde girer */
  .tentacle {
    position: absolute;
    left: 800px;
    top: -190px;
    width: 780px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="grid-lines"></div>
  <img class="tentacle" src="assets/tentacle.png" alt="">
  <div class="stage">
    <div class="copy">
      <div class="brand">
        <img src="../../public/icons/mark.svg" width="60" height="60" alt="">
        <span class="brand-name" style="font-size:38px">Ahtapot</span>
      </div>
      <div class="h1">Threat intel<br>on any page.</div>
      <p class="sub">11 intelligence sources and AI, in your browser.</p>
      <div class="pills">
        <span class="pill lime">Free &amp; open source</span>
        <span class="pill clean">No account needed</span>
      </div>
    </div>
  </div>
</body>
</html>
