<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body { width: 1280px; height: 800px; }
  .stage { display: flex; align-items: center; gap: 70px; padding: 0 72px; }

  .copy { width: 450px; flex-shrink: 0; }
  .copy .chip { margin-bottom: 18px; }
  .copy .h1 { font-size: 50px; margin-bottom: 18px; }
  .copy .sub { font-size: 18px; margin-bottom: 34px; }
  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .type {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 14px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'Commit Mono', monospace;
    font-size: 12px;
    color: var(--text-2);
  }
  .type::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  /* Soyut doküman: gerçek değer yok, iskelet satırlar + seçim + buton */
  .doc {
    flex: 1;
    padding: 40px 40px 96px;
    position: relative;
  }
  .doc-head { display: flex; gap: 7px; margin-bottom: 26px; }
  .doc-head i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.12); }

  .lines { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; }
  .bar { height: 14px; border-radius: 7px; background: rgba(255,255,255,.10); }
  .bar.dim { background: rgba(255,255,255,.06); }

  /* Seçili satırlar: lime seçim dolgusu */
  .bar.sel {
    background: rgba(199, 245, 77, 0.22);
    outline: 1px solid rgba(199, 245, 77, 0.28);
  }

  .fab {
    position: absolute;
    right: 96px;
    bottom: 30px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 11px 16px 11px 12px;
    background: #1A1A1F;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px;
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
  }
  .fab img { width: 22px; height: 22px; }
  .fab b { font-size: 13.5px; font-weight: 600; color: #fff; }
  .fab i {
    font-style: normal;
    min-width: 20px; height: 20px;
    padding: 0 6px;
    border-radius: 10px;
    background: rgba(199, 245, 77, .16);
    color: var(--accent);
    font-size: 11px; font-weight: 640;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cursor { position: absolute; right: 84px; bottom: 20px; }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="grid-lines"></div>
  <div class="stage">
    <div class="copy">
      <div class="chip">Detection</div>
      <div class="h1">Select anything.<br>We find the IOCs.</div>
      <p class="sub">Highlight any part of a page — Ahtapot picks out the indicators, even defanged ones like <span class="mono" style="color:var(--text)">hxxps://</span> and <span class="mono" style="color:var(--text)">[.]</span>, and offers to analyze them.</p>
      <div class="types">
        <span class="type">IPv4 / IPv6</span>
        <span class="type">Domain / URL</span>
        <span class="type">MD5 / SHA1 / SHA256</span>
        <span class="type">CVE ID</span>
        <span class="type">Email</span>
        <span class="type">BTC / ETH wallet</span>
      </div>
    </div>

    <div class="doc panel">
      <div class="doc-head"><i></i><i></i><i></i></div>
      <div class="lines">
        <div class="row"><span class="bar" style="width:62%"></span></div>
        <div class="row"><span class="bar dim" style="width:34%"></span><span class="bar" style="width:44%"></span></div>
        <div class="row"><span class="bar" style="width:18%"></span><span class="bar dim" style="width:26%"></span><span class="bar" style="width:30%"></span></div>
        <div class="row"><span class="bar dim" style="width:88%"></span></div>
        <div class="row"><span class="bar" style="width:24%"></span><span class="bar sel" style="width:38%"></span><span class="bar sel" style="width:20%"></span></div>
        <div class="row"><span class="bar sel" style="width:52%"></span><span class="bar dim" style="width:22%"></span></div>
        <div class="row"><span class="bar dim" style="width:40%"></span><span class="bar" style="width:26%"></span></div>
        <div class="row"><span class="bar" style="width:70%"></span></div>
      </div>

      <div class="fab">
        <img src="../../public/icons/mark.svg" alt="">
        <b>Analyze</b>
        <i>3</i>
      </div>
      <svg class="cursor" width="22" height="22" viewBox="0 0 24 24" fill="#F2F2F3" stroke="#0B0B0D" stroke-width="1.6"><path d="M5 3l14 9-6.5 1.5L9 20z"/></svg>
    </div>
  </div>
</body>
</html>
