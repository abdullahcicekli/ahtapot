<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body { width: 1280px; height: 800px; }
  .stage { display: flex; align-items: center; gap: 52px; padding: 0 64px; }

  .copy { width: 520px; flex-shrink: 0; }
  .copy .chip { margin-bottom: 22px; }
  .copy .h1 { font-size: 66px; margin-bottom: 22px; }
  .copy .sub { font-size: 30px; margin-bottom: 38px; }
  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .type {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 18px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    font-family: 'Commit Mono', monospace;
    font-size: 20px;
    color: var(--text-2);
  }
  .type::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  /* Soyut doküman: gerçek değer yok, iskelet satırlar + seçim + buton */
  .doc {
    flex: 1;
    padding: 44px 44px 108px;
    position: relative;
  }
  .doc-head { display: flex; gap: 10px; margin-bottom: 34px; }
  .doc-head i { width: 13px; height: 13px; border-radius: 50%; background: rgba(255,255,255,.14); }

  .lines { display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; gap: 14px; }
  .bar { height: 20px; border-radius: 10px; background: rgba(255,255,255,.11); }
  .bar.dim { background: rgba(255,255,255,.06); }

  /* Seçili satırlar: lime seçim dolgusu */
  .bar.sel {
    background: rgba(199, 245, 77, 0.26);
    outline: 1px solid rgba(199, 245, 77, 0.34);
  }

  .fab {
    position: absolute;
    right: 60px;
    bottom: 34px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 14px 22px 14px 16px;
    background: #1A1A1F;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px;
    box-shadow: 0 18px 40px rgba(0,0,0,.55);
  }
  .fab img { width: 32px; height: 32px; }
  .fab b { font-size: 24px; font-weight: 620; color: #fff; letter-spacing: -0.015em; }
  .fab i {
    font-style: normal;
    min-width: 30px; height: 30px;
    padding: 0 9px;
    border-radius: 15px;
    background: rgba(199, 245, 77, .18);
    color: var(--accent);
    font-size: 18px; font-weight: 660;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cursor { position: absolute; right: 44px; bottom: 18px; }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="grid-lines"></div>
  <div class="stage">
    <div class="copy">
      <div class="chip">Detection</div>
      <div class="h1">Select anything.<br>We find the IOCs.</div>
      <p class="sub">Defanged too: <span class="mono" style="color:var(--accent)">hxxps://</span> and <span class="mono" style="color:var(--accent)">[.]</span></p>
      <div class="types">
        <span class="type">IPv4 / IPv6</span>
        <span class="type">Domain / URL</span>
        <span class="type">MD5 / SHA256</span>
        <span class="type">CVE ID</span>
        <span class="type">Email</span>
        <span class="type">BTC / ETH</span>
      </div>
    </div>

    <div class="doc panel">
      <div class="doc-head"><i></i><i></i><i></i></div>
      <div class="lines">
        <div class="row"><span class="bar" style="width:62%"></span></div>
        <div class="row"><span class="bar dim" style="width:34%"></span><span class="bar" style="width:44%"></span></div>
        <div class="row"><span class="bar" style="width:18%"></span><span class="bar dim" style="width:26%"></span><span class="bar" style="width:30%"></span></div>
        <div class="row"><span class="bar dim" style="width:88%"></span></div>
        <div class="row"><span class="bar" style="width:24%"></span><span class="bar sel" style="width:38%"></span><span class="bar sel" style="width:20%"></span></div>
        <div class="row"><span class="bar sel" style="width:52%"></span><span class="bar dim" style="width:22%"></span></div>
        <div class="row"><span class="bar dim" style="width:40%"></span><span class="bar" style="width:26%"></span></div>
      </div>

      <div class="fab">
        <img src="../../public/icons/mark.svg" alt="">
        <b>Analyze</b>
        <i>3</i>
      </div>
      <svg class="cursor" width="30" height="30" viewBox="0 0 24 24" fill="#F2F2F3" stroke="#0B0B0D" stroke-width="1.6"><path d="M5 3l14 9-6.5 1.5L9 20z"/></svg>
    </div>
  </div>
</body>
</html>
