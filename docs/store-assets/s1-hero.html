<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body { width: 1280px; height: 800px; }
  .stage { display: flex; flex-direction: column; justify-content: center; padding: 0 80px; }

  .brand { display: flex; margin-bottom: 58px; }

  .chip { margin-bottom: 26px; }
  .h1 { font-size: 96px; margin-bottom: 28px; }
  .sub { font-size: 34px; max-width: 620px; }
  .pills { display: flex; gap: 12px; margin-top: 44px; }

  /* Kol sağdan bütün halde girer, kanca aşağı sarkar */
  .tentacle {
    position: absolute;
    left: 690px;
    top: -270px;
    width: 960px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="grid-lines"></div>
  <img class="tentacle" src="assets/tentacle.png" alt="">
  <div class="stage">
    <div class="brand">
      <img src="../../public/icons/mark.svg" width="64" height="64" alt="">
      <span class="brand-name">Ahtapot</span>
    </div>
    <div class="chip">IOC Analysis</div>
    <div class="h1">Threat intel<br>on any page.</div>
    <p class="sub">Select an IP, domain, URL or hash — get verdicts without leaving the tab.</p>
    <div class="pills">
      <span class="pill lime">11 sources</span>
      <span class="pill clean">Free &amp; open source</span>
      <span class="pill warn">AI verdicts</span>
    </div>
  </div>
</body>
</html>
