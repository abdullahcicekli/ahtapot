<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body { width: 440px; height: 280px; }
  .stage {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    gap: 16px;

  .tag em { font-style: normal; color: var(--accent); }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="grid-lines"></div>
  <div class="stage">
    <img src="../../public/icons/mark.svg" alt="">
    <div class="name">Ahtapot</div>
    <div class="tag">IOC Analysis · <em>11 sources</em> · AI</div>
  </div>
