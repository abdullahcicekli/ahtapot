<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body { width: 1280px; height: 800px; }
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 60px; }

  .chip { margin-bottom: 22px; }
  .h1 { font-size: 72px; margin-bottom: 20px; }
  .sub { font-size: 30px; margin-bottom: 54px; }

  .wall { display: grid; grid-template-columns: repeat(4, 288px); gap: 16px; }
  .tile {
    height: 124px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    display: flex; align-items: center; gap: 18px;
    padding: 0 24px;
  }
  .tile img { width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; }
  .tile span { text-align: left; }
  .tile i { display: block; font-style: normal; font-size: 22px; font-weight: 560; letter-spacing: -0.018em; white-space: nowrap; }
  .tile.wordmark { justify-content: center; }
  .tile.wordmark img { width: auto; height: 36px; max-width: 210px; }
  .tile.more { border-style: dashed; border-color: var(--border-hi); justify-content: center; }
  .tile.more b { font-size: 30px; font-weight: 620; letter-spacing: -0.02em; }
  .tile.more b em { font-style: normal; color: var(--accent); }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="grid-lines"></div>
  <div class="stage">
    <div class="chip">Coverage</div>
    <div class="h1">11 intelligence sources.<br>One click.</div>
    <p class="sub">Checked in parallel. Results stream in as each source answers.</p>

    <div class="wall">
      <div class="tile"><img src="../../public/provider-icons/virustotal_logo.png" alt=""><span><i>VirusTotal</i></span></div>
      <div class="tile"><img src="../../public/provider-icons/siberguvenlik-logo.png" alt=""><span><i>Türkiye SGB</i></span></div>
      <div class="tile"><img src="../../public/provider-icons/alienVaultOtx-logo.png" alt=""><span><i>AlienVault OTX</i></span></div>
      <div class="tile"><img src="../../public/provider-icons/abuseipdb-logo.png" alt=""><span><i>AbuseIPDB</i></span></div>
      <div class="tile wordmark"><img src="../../public/provider-icons/malwarebazaar-logo.png" alt="MalwareBazaar"></div>
      <div class="tile"><img src="../../public/provider-icons/arin-logo.png" alt="" style="filter: invert(1) hue-rotate(180deg) brightness(1.35)"><span><i>ARIN</i></span></div>
      <div class="tile"><img src="../../public/provider-icons/shodan-logo.png" alt=""><span><i>Shodan</i></span></div>
      <div class="tile"><img src="../../public/provider-icons/greynoise-logo.png" alt=""><span><i>GreyNoise</i></span></div>
      <div class="tile wordmark"><img src="../../public/provider-icons/urlhaus-logo.png" alt="URLhaus"></div>
      <div class="tile"><img src="../../public/provider-icons/pulsedive-logo.png" alt=""><span><i>Pulsedive</i></span></div>
      <div class="tile"><img src="../../public/provider-icons/scamalytics-logo.png" alt=""><span><i>Scamalytics</i></span></div>
      <div class="tile more"><b>+ <em>AI</em> verdicts</b></div>
    </div>
  </div>
</body>
</html>
