<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body { width: 1280px; height: 800px; }
  .stage { display: flex; align-items: center; gap: 52px; padding: 0 64px; }

  /* Settings mockup: folder tabs + api key gallery */
  .settings { width: 680px; flex-shrink: 0; padding: 26px; }

  .tabs { display: flex; gap: 10px; }
  .tab {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 17px 0 20px;
    font-family: 'Commit Mono', monospace;
    font-size: 18px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-3);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 18px 18px 0 0;
    background: var(--bg-card);
  }
  .tab.active {
    color: var(--text);
    background: linear-gradient(180deg, #202024, var(--bg-inset));
    border-color: var(--border-hi);
  }
  .tab-body {
    border: 1px solid var(--border-hi);
    border-radius: 0 18px 18px 18px;
    background: var(--bg-inset);
    padding: 22px;
    margin-top: -1px;
  }

  .filters { display: flex; gap: 10px; margin-bottom: 18px; }
  .filter {
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border-hi);
    font-size: 19px; font-weight: 520; letter-spacing: -0.01em;
    color: var(--text-2);
    background: var(--bg-card);
  }
  .filter.on { background: var(--text); color: var(--accent-ink); border-color: transparent; font-weight: 640; }

  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .key { padding: 18px; }
  .key-head { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
  .key-head img { width: 30px; height: 30px; object-fit: contain; flex-shrink: 0; }
  .key-head b { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; white-space: nowrap; }
  .key-head .pill { margin-left: auto; font-size: 13px; padding: 6px 10px; white-space: nowrap; }
  .key-input {
    display: flex; align-items: center;
    padding: 12px 15px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'Commit Mono', monospace;
    font-size: 17px;
    color: var(--text-3);
    letter-spacing: .2em;
  }

  .copy { flex: 1; }
  .copy .chip { margin-bottom: 22px; }
  .copy .h1 { font-size: 64px; margin-bottom: 44px; }
  .features { display: flex; flex-direction: column; gap: 26px; }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="grid-lines"></div>
  <div class="stage">
    <div class="settings panel">
      <div class="tabs">
        <span class="tab">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          General
        </span>
        <span class="tab active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          API Keys
        </span>
      </div>
      <div class="tab-body">
        <div class="filters">
          <span class="filter on">All · 11</span>
          <span class="filter">Configured · 4</span>
          <span class="filter">Missing key · 7</span>
        </div>
        <div class="keys">
          <div class="key card">
            <div class="key-head"><img src="../../public/provider-icons/virustotal_logo.png" alt=""><b>VirusTotal</b><span class="pill clean">Set</span></div>
            <div class="key-input">••••••••••••••••</div>
          </div>
          <div class="key card">
            <div class="key-head"><img src="../../public/provider-icons/siberguvenlik-logo.png" alt=""><b>Türkiye SGB</b><span class="pill lime">No key</span></div>
            <div class="key-input" style="letter-spacing:0">Always on</div>
          </div>
          <div class="key card">
            <div class="key-head"><img src="../../public/provider-icons/abuseipdb-logo.png" alt=""><b>AbuseIPDB</b><span class="pill clean">Set</span></div>
            <div class="key-input">••••••••••••••••</div>
          </div>
          <div class="key card">
            <div class="key-head"><img src="../../public/provider-icons/shodan-logo.png" alt=""><b>Shodan</b><span class="pill warn">Add key</span></div>
            <div class="key-input" style="letter-spacing:0">Paste API key…</div>
          </div>
        </div>
      </div>
    </div>

    <div class="copy">
      <div class="chip">Private by design</div>
      <div class="h1">Your keys.<br>Your machine.</div>
      <div class="features">
        <div class="feature">
          <span class="feature-dot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C7F54D" stroke-width="2.4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          No backend, no account
        </div>
        <div class="feature">
          <span class="feature-dot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C7F54D" stroke-width="2.4"><path d="M12 2v4"/><path d="M12 18v4"/><path d="m4.93 4.93 2.83 2.83"/><path d="m16.24 16.24 2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="m4.93 19.07 2.83-2.83"/><path d="m16.24 7.76 2.83-2.83"/></svg></span>
          Works out of the box
        </div>
        <div class="feature">
          <span class="feature-dot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C7F54D" stroke-width="2.4"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></span>
          Smart caching
        </div>
      </div>
    </div>
  </div>
</body>
</html>
